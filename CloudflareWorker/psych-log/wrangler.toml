name = "psych-log"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "psych_log_db"
database_id = "52402cfd-46fc-4db3-82fd-45e559dbba28"

[vars]
# Folder (inside the Dropbox app folder) that holds the reports.
DROPBOX_FOLDER = "/PsychGameLogs"

# Every 5 min: safety net that re-runs the Dropbox sync in case a
# write-triggered one was skipped (lock held) or failed (Dropbox hiccup).
# 04:00 and 16:00 UTC: full .sql backup of the database to Dropbox
# (src/backup.js). That's midnight/noon EDT; during EST it runs at 11 PM/11 AM.
[triggers]
crons = ["*/5 * * * *", "0 4,16 * * *"]

# Set these as secrets, not here — never commit real values:
#   wrangler secret put DROPBOX_APP_KEY
#   wrangler secret put DROPBOX_APP_SECRET
#   wrangler secret put DROPBOX_REFRESH_TOKEN
