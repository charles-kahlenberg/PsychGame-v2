<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PsychGame</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    #unityContainer {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #111;
    }
  </style>
</head>
<body>
  <div id="unityContainer">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/69ab99d3537008d92859734538a5dc4d.loader.js";
    const config = {
      dataUrl: buildUrl + "/a411770b58016908509dd637c23f5845.data",
      frameworkUrl: buildUrl + "/f1274213efc7340ef661479d19d7d335.framework.js",
      codeUrl: buildUrl + "/c8c80026aa127b96b4fe581b38c8ed09.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "PsychGame",
      productVersion: "1.0",
    };

    const canvas = document.querySelector("#unity-canvas");

    // Size the canvas' internal render resolution to match the actual
    // viewport (scaled by devicePixelRatio) so the game renders crisply
    // instead of being stretched from a stale low-res buffer. Without this,
    // the canvas keeps its default 300x150 backing size until the first
    // resize event, which is what causes the blurry/scaled look on monitors
    // with resolutions different from the one the game was last tested on.
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Try to enter real browser fullscreen immediately on launch. Browsers
    // only allow requestFullscreen() during a user gesture, so this silently
    // no-ops on load in most browsers; the click/keydown fallback below
    // catches the very first user interaction as a launch-time trigger.
    function goFullscreen(unityInstance) {
      if (!document.fullscreenElement) {
        unityInstance.SetFullscreen(1);
      }
    }

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config).then((unityInstance) => {
        console.log("Unity loaded");
        goFullscreen(unityInstance);
        const enterFullscreenOnce = () => {
          goFullscreen(unityInstance);
          window.removeEventListener("click", enterFullscreenOnce);
          window.removeEventListener("keydown", enterFullscreenOnce);
        };
        window.addEventListener("click", enterFullscreenOnce);
        window.addEventListener("keydown", enterFullscreenOnce);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
