<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PsychGame</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    #unityContainer {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #111;
    }
  </style>
</head>
<body>
  <div id="unityContainer">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/9dce97070fb0a57155fddeafce288b37.loader.js";
    const config = {
      dataUrl: buildUrl + "/caeed6e1f5f2575bec4fd2ff0bd719d0.data",
      frameworkUrl: buildUrl + "/f7ddf3caf950870c28affbf49bb040b2.framework.js",
      codeUrl: buildUrl + "/aa76126f9b96b59fa46f97478de34b0a.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "PsychGame",
      productVersion: "1.0",
    };

    // Browsers refuse a context with this flag when they would draw in
    // software (no graphics card: acceleration off, a missing driver, a
    // blocklisted GPU). There, render at half resolution, a quarter of the
    // pixels, so the game stays playable; the game reads the flag through
    // GraphicsCheck.jslib to tell the player how to fix it.
    window.psychSoftwareRendering = !document.createElement("canvas")
      .getContext("webgl2", { failIfMajorPerformanceCaveat: true });
    if (window.psychSoftwareRendering) config.devicePixelRatio = 0.5;

    const canvas = document.querySelector("#unity-canvas");

    // Size the canvas' internal render resolution to match the actual
    // viewport (scaled by devicePixelRatio) so the game renders crisply
    // instead of being stretched from a stale low-res buffer. Without this,
    // the canvas keeps its default 300x150 backing size until the first
    // resize event, which is what causes the blurry/scaled look on monitors
    // with resolutions different from the one the game was last tested on.
    function resizeCanvas() {
      const dpr = config.devicePixelRatio || window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Browsers only allow requestFullscreen() during a real user gesture
    // (a click or keypress) — calling it on load throws in Safari and is a
    // silent no-op elsewhere, so it must only ever be triggered from inside
    // an actual click/keydown handler. The try/catch is a safety net for
    // contexts (e.g. embedded iframes) where fullscreen is disallowed even
    // during a gesture, so a rejection never surfaces as an error dialog.
    function goFullscreen(unityInstance) {
      if (!document.fullscreenElement) {
        try {
          unityInstance.SetFullscreen(1);
        } catch (e) {
          console.warn("Fullscreen request failed:", e);
        }
      }
    }

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config).then((unityInstance) => {
        console.log("Unity loaded");
        const enterFullscreenOnce = () => {
          goFullscreen(unityInstance);
          window.removeEventListener("click", enterFullscreenOnce);
          window.removeEventListener("keydown", enterFullscreenOnce);
        };
        window.addEventListener("click", enterFullscreenOnce);
        window.addEventListener("keydown", enterFullscreenOnce);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
